; ============================================================
;  WALL-E - Innovation Day AI Robot (ESP32-C3)
;  PlatformIO project configuration
; ============================================================

[env:walle]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

; ---- Serial ----
monitor_speed      = 115200
upload_speed       = 921600

; ---- Build ----
build_type         = release
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    ; Hard cap on the main task stack (C3 has little RAM).
    -DARDUINO_RUNNING_CORE=1

; ---- Flash layout ----
board_build.partitions = default.csv

; ---- Libraries (kept intentionally minimal) ----
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4

; ============================================================
;  Hardware test build
;  Boots into an interactive serial menu where each part can be
;  checked on its own. Motors only move while a motor test runs.
;  Use: pio run -e walle_test  --upload
; ============================================================
[env:walle_test]
extends        = env:walle
build_flags =
    ${env:walle.build_flags}
    -DWALLE_TEST_MODE=1
