; ============================================================
;  WALL-E remote controller — ESP32-WROOM
;  ------------------------------------------------------------
;  A separate, standalone firmware. It reads buttons and sends
;  commands to the ESP32-S3 robot over ESP-NOW. It holds no robot
;  logic and shares no source code with the robot — only the
;  constants in ../shared/walle_protocol.h.
;
;  Build:  pio run            (from the remote_wroom/ folder)
;          pio run --upload
; ============================================================

[env:walle_remote]
platform  = espressif32
board     = esp32dev                 ; plain ESP32 = ESP32-WROOM dev board
framework = arduino

; ---- Serial ----
monitor_speed      = 115200
upload_speed       = 921600

; ---- Build ----
build_type         = release
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_RUNNING_CORE=1
    -DWALLE_TARGET_WROOM=1
    ; ---- shared protocol constants (WROOM <-> S3 wire format) ----
    -I$PROJECT_DIR/../shared

; ---- Flash layout ----
board_build.partitions = default.csv

; ---- Libraries ----
; None. ESP-NOW and Wi-Fi are part of the ESP-IDF core that ships
; with the Arduino framework, so this firmware has no lib_deps and
; builds in seconds. The remote must stay this small: it is the
; battery-powered half of the system.
lib_deps =
