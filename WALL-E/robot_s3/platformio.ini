; ============================================================
;  WALL-E robot firmware — ESP32-S3
;  ------------------------------------------------------------
;  This is the MAIN WALL-E brain: motors, OLED, expressions,
;  the state machine, autonomous behaviour, dance, Gemini text
;  AI, the companion-app link and the wireless remote link.
;
;  The separate ESP32-WROOM remote lives in ../remote_wroom and
;  has its own platformio.ini. The two projects share only the
;  constants in ../shared/walle_protocol.h (via -I), so no code
;  is ever compiled into the wrong target.
; ============================================================

[env:walle_s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ---- Serial ----
monitor_speed      = 115200
upload_speed       = 921600

; ---- Build ----
build_type         = release
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_RUNNING_CORE=1
    -DWALLE_TARGET_S3=1
    ; ---- shared protocol constants (WROOM <-> S3 wire format) ----
    -I$PROJECT_DIR/../shared

; ---- Flash layout ----
; The S3 devkit is an 8 MB part, so use the 8 MB table: the stock
; 4 MB "default.csv" leaves only 1.2 MB of app space, which is
; wasted on this board.
board_build.partitions = default_8MB.csv

; ---- Libraries ----
; Unchanged by the STT/TTS removal: the SSD1306 driver and GFX
; draw the face, ArduinoJson parses the Gemini replies. The audio
; libraries that are gone were all built into the ESP-IDF core.
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4

; ============================================================
;  Hardware test build
;  Boots into an interactive serial menu where each part can be
;  checked on its own. Motors only move while a motor test runs.
;  Use: pio run -e walle_s3_test --upload
; ============================================================
[env:walle_s3_test]
extends        = env:walle_s3
build_flags =
    ${env:walle_s3.build_flags}
    -DWALLE_TEST_MODE=1
